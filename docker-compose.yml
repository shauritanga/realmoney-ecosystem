services:
  postgres:
    image: postgres:16-alpine
    container_name: realmoney-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: realmoney_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: realmoney-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kyc-service:
    build:
      context: ./apps/kyc-service
      dockerfile: Dockerfile
    container_name: realmoney-kyc-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VERIFICATION_BRIDGE_TOKEN=realmoney-bridge-secret-key-change-me
      - CAPTURE_BASE_URL=https://capture.realmoney.tz
      - KYC_DEV_MODE=false
    volumes:
      - kyc_data:/app/data

volumes:
  postgres_data:
  redis_data:
  kyc_data:
